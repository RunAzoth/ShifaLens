<svg xmlns="http://www.w3.org/2000/svg" width="412" height="840" viewBox="0 0 412 840">
  <rect width="412" height="840" fill="#FFFBF5"/>
  <!-- AI Tag -->
  <rect x="20" y="20" width="372" height="52" rx="16" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.4"/>
  <text x="36" y="52" font-family="sans-serif" font-size="14" font-weight="bold" fill="#115E59">✨ AI-generated: verify with your pharmacist • فارماسسٹ سے تصدیق کریں</text>

  <text x="372" y="106" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#115E59">دوا کے پتوں (Strips) کو نسخے سے ملائیں</text>
  <text x="20" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4B5563">Strip Matching Results &amp; Blister Sticker Maker</text>

  <!-- Result 1: Confidently Matched Strip -->
  <rect x="20" y="150" width="372" height="114" rx="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <circle cx="58" cy="207" r="24" fill="#0F766E"/>
  <text x="58" y="215" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">A</text>
  <text x="96" y="188" font-family="sans-serif" font-size="17" font-weight="bold" fill="#166534">✓ مکمل میل کھاتا ہے: Augmentin 625 mg</text>
  <text x="96" y="214" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">Matched: Augmentin 625 mg (96%)</text>
  <text x="96" y="238" font-family="sans-serif" font-size="13" fill="#4B5563">Read on strip: "AUGMENTIN 625mg Co-amoxiclav"</text>

  <!-- Result 2: Strength Mismatch -->
  <rect x="20" y="280" width="372" height="122" rx="24" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="372" y="316" text-anchor="end" font-family="sans-serif" font-size="17" font-weight="bold" fill="#92400E">⚠ طاقت (mg) مختلف ہے — فارماسسٹ سے پوچھیں</text>
  <text x="36" y="344" font-family="sans-serif" font-size="15" font-weight="bold" fill="#92400E">Strength mismatch — check mg with pharmacist</text>
  <text x="36" y="370" font-family="sans-serif" font-size="13" fill="#1F2937">The mg strength on this strip (375 mg) differs from your Rx (625 mg).</text>

  <!-- Result 3: Not in Prescription -->
  <rect x="20" y="418" width="372" height="114" rx="24" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="372" y="454" text-anchor="end" font-family="sans-serif" font-size="17" font-weight="bold" fill="#991B1B">🚫 یہ دوا اس نسخے میں شامل نہیں ہے</text>
  <text x="36" y="480" font-family="sans-serif" font-size="15" font-weight="bold" fill="#991B1B">Not in this prescription</text>
  <text x="36" y="504" font-family="sans-serif" font-size="13" fill="#1F2937">This strip does not match any medicine on your confirmed plan.</text>

  <!-- Missing Prescribed Medicine Callout -->
  <rect x="20" y="548" width="372" height="96" rx="20" fill="#F7F2EA" stroke="#E5DEC9" stroke-width="1.5"/>
  <text x="36" y="580" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1F2937">Prescribed medicines with no matched strip yet:</text>
  <text x="36" y="610" font-family="sans-serif" font-size="15" font-weight="bold" fill="#B45309">[B] Panadol 500 mg — پتہ ابھی شامل نہیں ہوا</text>

  <!-- Make Stickers CTA -->
  <rect x="20" y="666" width="372" height="84" rx="24" fill="#0F766E"/>
  <text x="206" y="704" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">🖨️ پتوں پر لگانے کے لیے اسٹیکرز بنائیں</text>
  <text x="206" y="730" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#CCFBF1">Make stickers for my medicine strips (PNG-to-PDF)</text>
</svg>
