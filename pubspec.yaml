name: shifalens
description: "ShifaLens — A pharmacist's explanation for every patient, in Urdu, with pictures."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  firebase_ai: ^5.1.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_tts: ^4.2.5
  audioplayers: ^6.7.1
  record: ^6.2.1
  image_picker: ^1.2.2
  image: 4.5.4
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_email_sender: ^8.0.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  uuid: ^4.6.0
  intl: ^0.20.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/demo/
    - assets/demo/cached/
    - assets/fonts/
