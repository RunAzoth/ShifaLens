<svg xmlns="http://www.w3.org/2000/svg" width="412" height="840" viewBox="0 0 412 840">
  <defs>
    <linearGradient id="dayArc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>
  <rect width="412" height="840" fill="#FFFBF5"/>

  <!-- Sticky Voice Bar -->
  <rect x="20" y="20" width="372" height="64" rx="20" fill="#0F766E"/>
  <text x="368" y="48" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">🔊 میرا شیڈول اردو میں سنیں</text>
  <text x="36" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#CCFBF1">🔊 Listen to my plan (Urdu Voice)</text>

  <!-- Ramadan Toggle Card -->
  <rect x="20" y="96" width="372" height="60" rx="20" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1.5"/>
  <text x="36" y="132" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3730A3">🌙 Ramadan Mode (Suhoor &amp; Iftar) • رمضان موڈ</text>

  <!-- Unscheduled "Ask your pharmacist" Card -->
  <rect x="20" y="168" width="372" height="84" rx="20" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="372" y="198" text-anchor="end" font-family="sans-serif" font-size="17" font-weight="bold" fill="#92400E">شیڈول میں شامل نہیں: اپنے فارماسسٹ سے پوچھیں (1)</text>
  <text x="36" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1F2937">Not scheduled: Tab. ????? 1+0+1 — Verify with pharmacist</text>

  <!-- Vertical Day Arc Container -->
  <rect x="20" y="264" width="372" height="476" rx="24" fill="url(#dayArc)" stroke="#E5DEC9" stroke-width="1.5"/>
  <text x="36" y="298" font-family="sans-serif" font-size="17" font-weight="bold" fill="#115E59">☀️ Breakfast • ناشتہ (08:30)   [NOW • ابھی]</text>

  <!-- DoseCard 1: Risek before breakfast -->
  <rect x="36" y="312" width="340" height="88" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <polygon points="64,332 84,368 44,368" fill="#3730A3"/>
  <text x="64" y="363" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">C</text>
  <text x="98" y="344" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1F2937">Risek 20 mg (Omeprazole)</text>
  <text x="98" y="368" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B45309">کھانے سے پہلے • Before meal</text>
  <circle cx="344" cy="356" r="18" fill="#16A34A"/>
  <text x="344" y="362" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">✓</text>

  <!-- DoseCard 2: Augmentin after breakfast -->
  <rect x="36" y="412" width="340" height="88" rx="18" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1.5"/>
  <circle cx="64" cy="456" r="22" fill="#0F766E"/>
  <text x="64" y="463" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">A</text>
  <text x="98" y="444" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1F2937">Augmentin 625 mg</text>
  <text x="98" y="468" font-family="sans-serif" font-size="14" font-weight="bold" fill="#115E59">کھانے کے بعد • After meal</text>

  <!-- Night Slot -->
  <text x="36" y="544" font-family="sans-serif" font-size="17" font-weight="bold" fill="#3730A3">🌙 Dinner • رات کا کھانا (20:00)</text>
  <rect x="36" y="558" width="340" height="88" rx="18" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1.5"/>
  <circle cx="64" cy="602" r="22" fill="#0F766E"/>
  <text x="64" y="609" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">A</text>
  <text x="98" y="590" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1F2937">Augmentin 625 mg</text>
  <text x="98" y="614" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3730A3">کھانے کے بعد • After meal</text>

  <!-- 4-Tab Bottom Navigation -->
  <rect x="0" y="756" width="412" height="84" fill="#FFFFFF" stroke="#E5DEC9"/>
  <rect x="12" y="766" width="92" height="64" rx="14" fill="#CCFBF1"/>
  <text x="58" y="796" text-anchor="middle" font-size="14" font-weight="bold" fill="#115E59">آج کا دن</text>
  <text x="58" y="814" text-anchor="middle" font-size="12" font-weight="bold" fill="#115E59">Today</text>
  <text x="156" y="804" text-anchor="middle" font-size="13" fill="#4B5563">دوائیں • Meds</text>
  <text x="256" y="804" text-anchor="middle" font-size="13" fill="#4B5563">پوچھیں • Ask</text>
  <text x="354" y="804" text-anchor="middle" font-size="13" fill="#4B5563">یاد دہانی • Alerts</text>
</svg>
